<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de capas de VetChiloé</title>
  <desc id="description">Flujo desde la presentación React hasta la base de datos JSON a través de rutas, controladores, servicios y repositorios; la respuesta del paciente vuelve hacia la presentación.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4faf6"/>
      <stop offset="1" stop-color="#e8f2ec"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#174c38" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#21845b"/>
    </marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#6a9a80"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { fill: #163b2d; font-size: 34px; font-weight: 750; }
      .subtitle { fill: #587264; font-size: 17px; }
      .card-title { fill: #183d2e; font-size: 20px; font-weight: 700; }
      .card-copy { fill: #536b5e; font-size: 15px; }
      .card-path { fill: #397451; font-size: 13px; font-weight: 600; }
      .badge-text { fill: #fff; font-size: 15px; font-weight: 700; }
      .arrow-label { fill: #397451; font-size: 13px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1000" height="1220" rx="28" fill="url(#background)"/>
  <circle cx="930" cy="85" r="120" fill="#dcece2" opacity=".55"/>
  <circle cx="45" cy="1125" r="145" fill="#dcece2" opacity=".4"/>

  <text class="title" x="92" y="82">Arquitectura por capas · VetChiloé</text>
  <text class="subtitle" x="94" y="116">La solicitud avanza por las capas y el resultado vuelve al cliente.</text>

  <g filter="url(#shadow)">
    <rect x="185" y="160" width="630" height="112" rx="18" fill="#fff" stroke="#55a477" stroke-width="3"/>
    <rect x="185" y="320" width="630" height="112" rx="18" fill="#fff" stroke="#55a477" stroke-width="3"/>
    <rect x="185" y="480" width="630" height="112" rx="18" fill="#fff" stroke="#55a477" stroke-width="3"/>
    <rect x="185" y="640" width="630" height="112" rx="18" fill="#fff" stroke="#55a477" stroke-width="3"/>
    <rect x="185" y="800" width="630" height="112" rx="18" fill="#fff" stroke="#55a477" stroke-width="3"/>
    <rect x="185" y="960" width="630" height="112" rx="18" fill="#e4f1e8" stroke="#37865c" stroke-width="3"/>
  </g>

  <g>
    <circle cx="222" cy="196" r="18" fill="#21845b"/><text class="badge-text" x="222" y="201" text-anchor="middle">1</text>
    <text class="card-title" x="258" y="198">Presentación</text>
    <text class="card-copy" x="258" y="225">React + Vite · muestra pacientes y captura acciones del usuario</text>
    <text class="card-path" x="258" y="251">src/App.jsx y componentes</text>

    <circle cx="222" cy="356" r="18" fill="#21845b"/><text class="badge-text" x="222" y="361" text-anchor="middle">2</text>
    <text class="card-title" x="258" y="358">Rutas</text>
    <text class="card-copy" x="258" y="385">Express · define endpoints GET y POST y dirige las peticiones</text>
    <text class="card-path" x="258" y="411">server/routes</text>

    <circle cx="222" cy="516" r="18" fill="#21845b"/><text class="badge-text" x="222" y="521" text-anchor="middle">3</text>
    <text class="card-title" x="258" y="518">Controladores</text>
    <text class="card-copy" x="258" y="545">Express · leen req, llaman al servicio y responden con res</text>
    <text class="card-path" x="258" y="571">server/controllers</text>

    <circle cx="222" cy="676" r="18" fill="#21845b"/><text class="badge-text" x="222" y="681" text-anchor="middle">4</text>
    <text class="card-title" x="258" y="678">Servicios</text>
    <text class="card-copy" x="258" y="705">Reglas de negocio · validan datos y generan el N° de atención</text>
    <text class="card-path" x="258" y="731">server/business</text>

    <circle cx="222" cy="836" r="18" fill="#21845b"/><text class="badge-text" x="222" y="841" text-anchor="middle">5</text>
    <text class="card-title" x="258" y="838">Repositorio</text>
    <text class="card-copy" x="258" y="865">Único acceso a los datos · lee y escribe, sin reglas de negocio</text>
    <text class="card-path" x="258" y="891">server/data</text>

    <circle cx="222" cy="996" r="18" fill="#21845b"/><text class="badge-text" x="222" y="1001" text-anchor="middle">6</text>
    <text class="card-title" x="258" y="998">Base de datos JSON (actual)</text>
    <text class="card-copy" x="258" y="1025">Guarda los pacientes y conserva sus datos</text>
    <text class="card-path" x="258" y="1051">src/data/pacientes.json</text>
  </g>

  <g fill="none" stroke="#21845b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M500 277v34"/>
    <path d="M500 437v34"/>
    <path d="M500 597v34"/>
    <path d="M500 757v34"/>
    <path d="M500 917v34"/>
  </g>
  <g class="arrow-label" text-anchor="middle">
    <text x="548" y="300">HTTP</text>
    <text x="548" y="460">enruta</text>
    <text x="548" y="620">req.body</text>
    <text x="548" y="780">valida</text>
    <text x="548" y="940">lee / escribe</text>
  </g>

  <path d="M500 1078v50H110V216h65" fill="none" stroke="#6a9a80" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow-light)"/>
  <rect x="250" y="1107" width="335" height="42" rx="21" fill="#f4faf6" stroke="#b8d6c2" stroke-width="2"/>
  <text class="arrow-label" x="417" y="1134" text-anchor="middle">Paciente creado · respuesta HTTP</text>
  <text class="subtitle" x="500" y="1184" text-anchor="middle">El repositorio es el único que accede al archivo JSON.</text>
</svg>
